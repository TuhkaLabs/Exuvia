# Exuvia community rules
#
# This file is shipped with the application and is safe to extend. Each rule
# describes locations that belong to one application. Rules never bypass the
# hard-coded safety policy: protected paths are rejected at load time.
#
# Schema: 1
# License: CC0-1.0

schema = 1
version = "2026.10.1"

[app."discord"]
name = "Discord"
publisher = "Discord Inc."
aliases = ["Discord PTB", "Discord Canary"]
platforms = ["windows"]

[[app."discord".paths]]
path = "%APPDATA%\\discord"
kind = "user-data"
confidence = "high"

[[app."discord".paths]]
path = "%LOCALAPPDATA%\\Discord"
kind = "cache"
confidence = "high"

[[app."discord".registry]]
key = "HKCU\\Software\\Discord"
kind = "config"
confidence = "high"

