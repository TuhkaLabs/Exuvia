[workspace]
resolver = "2"
members = [
    "crates/exuvia-core",
    "crates/exuvia-platform",
    "crates/exuvia-rules",
    "crates/exuvia-store",
    "crates/exuvia-cli",
    "crates/exuvia-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TuhkaLabs/exuvia"
authors = ["TuhkaLabs"]

[workspace.dependencies]
assert_cmd = "2.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
path-clean = "1.0"
predicates = "3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.13"
thiserror = "2.0"
toml = "0.8"
unicode-normalization = "0.1"
walkdir = "2.5"
winreg = "0.55"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
